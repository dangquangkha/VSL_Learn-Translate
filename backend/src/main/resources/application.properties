spring.application.name=vsl-backend

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vsl_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vsl_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vsl_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Cloudflare R2 Credentials (NFR-002: Direct Upload support)
r2.endpoint=${R2_ENDPOINT:https://account_id.r2.cloudflarestorage.com}
r2.access-key=${R2_ACCESS_KEY:dummy_access_key}
r2.secret-key=${R2_SECRET_KEY:dummy_secret_key}
r2.bucket-name=${R2_BUCKET_NAME:vsl-data}

# JWT Secret
jwt.secret=${JWT_SECRET:vsl_learn_translate_super_secret_jwt_key_256bits_minimum_length!}
